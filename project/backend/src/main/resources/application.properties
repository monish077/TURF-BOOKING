# =============== MongoDB Configuration ==============
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=${MONGODB_DATABASE}
spring.data.mongodb.auto-index-creation=true

# =============== Email Service Configuration ============
spring.mail.host=${EMAIL_HOST}
spring.mail.port=${EMAIL_PORT}
spring.mail.username=${EMAIL_USERNAME}
spring.mail.password=${EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# =============== JWT Settings ===========================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# =============== Server Settings ========================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# =============== Actuator Settings ======================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# =============== Cloudinary ============================
cloudinary.url=${CLOUDINARY_URL}

# =============== Spring Data MongoDB ====================
spring.data.mongodb.field-naming-strategy=org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

# =============== Connection Timeouts ====================
spring.data.mongodb.connection-timeout=30000
spring.data.mongodb.socket-timeout=30000
spring.data.mongodb.server-selection-timeout=30000

# =============== Production Logging =====================
logging.level.root=INFO
logging.level.com.example.demo.turfbooking=INFO
# In your application.properties, add:
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}